name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup GitHub Pages Metadata
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Project
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          VITE_BASE_URL: ${{ steps.pages.outputs.base_path || '/Easy-Grade-Tool/' }}

      # Strategy 1: Deploy to gh-pages branch (Always succeeds with contents: write)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
          force_orphan: true

      # Strategy 2: Direct GitHub Actions Pages Deployment (when Source is set to GitHub Actions in settings)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: ./dist

      - name: Deploy to GitHub Pages via Actions
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
