<!-- Put in <head> of the Quick Grade page. Visible FAQ text on the page MUST match these answers (Google requirement).
     Add the matching visible block from faq-visible.html below your tool. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {"@type":"Question","name":"How do I calculate a test grade from the number of questions?",
     "acceptedAnswer":{"@type":"Answer","text":"Divide the number of correct answers by the total number of questions and multiply by 100. For example, 17 correct out of 20 is 17 ÷ 20 × 100 = 85%."}},
    {"@type":"Question","name":"How do I print a grading chart for my class?",
     "acceptedAnswer":{"@type":"Answer","text":"Enter the number of questions, then press Print chart. The page prints only the grading table, without the site menu or extra text."}},
    {"@type":"Question","name":"Can I use this grade calculator offline?",
     "acceptedAnswer":{"@type":"Answer","text":"Yes. After your first visit the calculator is saved on your device and keeps working without an internet connection."}},
    {"@type":"Question","name":"Can I change the A, B, C and D cut-offs?",
     "acceptedAnswer":{"@type":"Answer","text":"Yes. Open Advanced settings and set your own percentage cut-offs for each letter grade. The chart updates immediately."}},
    {"@type":"Question","name":"What is the difference between a number-correct chart and a number-missed chart?",
     "acceptedAnswer":{"@type":"Answer","text":"A number-correct chart lists scores from the top down by questions answered correctly. A number-missed chart lists the percent for each count of questions a student got wrong, which is faster when you mark errors on papers."}},
    {"@type":"Question","name":"Is my data stored on a server?",
     "acceptedAnswer":{"@type":"Answer","text":"No. All calculations run in your browser. Your settings are saved only on your own device."}}
  ]
}
</script>
