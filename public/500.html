<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>500 — Server Error | Easy Grade Tool</title>
    <meta name="description" content="An internal server error occurred while processing your request. Please try again." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <style>
      :root {
        --bg: #F3F4F6;
        --card: #FFFFFF;
        --text: #191C1E;
        --muted: #64748B;
        --danger: #DC2626;
        --primary: #004851;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0F172A;
          --card: #1E293B;
          --text: #F8FAFC;
          --muted: #94A3B8;
          --danger: #F87171;
          --primary: #14B8A6;
        }
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        background: var(--card);
        border-radius: 28px;
        padding: 48px 36px;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      }
      .code {
        font-size: 80px;
        font-weight: 900;
        line-height: 1;
        color: var(--danger);
        margin: 0 0 16px;
        letter-spacing: -3px;
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        margin: 0 0 12px;
      }
      p {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
        margin: 0 0 28px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 28px;
        border-radius: 9999px;
        background: var(--primary);
        color: #FFFFFF;
        text-decoration: none;
        font-weight: 700;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">500</div>
      <h1>Internal Server Error</h1>
      <p>We encountered an unexpected error processing your request. Please reload the page or return to the calculators.</p>
      <a href="/" class="btn">Return to Home</a>
    </div>
  </body>
</html>
