<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Easy Grade Tool</title>
    <meta name="description" content="The page you requested could not be found. Return to the Easy Grade Tool home page." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <style>
      :root {
        --bg: #F3F4F6;
        --card: #FFFFFF;
        --text: #191C1E;
        --muted: #64748B;
        --primary: #4C5985;
        --primary-hover: #3D476B;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0F172A;
          --card: #1E293B;
          --text: #F8FAFC;
          --muted: #94A3B8;
          --primary: #8A98C4;
          --primary-hover: #AAB5D6;
        }
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        background: var(--card);
        border-radius: 28px;
        padding: 48px 36px;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      }
      .code {
        font-size: 80px;
        font-weight: 900;
        line-height: 1;
        color: var(--primary);
        margin: 0 0 16px;
        letter-spacing: -3px;
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        margin: 0 0 12px;
        letter-spacing: -0.5px;
      }
      p {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
        margin: 0 0 28px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 28px;
        border-radius: 9999px;
        background: var(--primary);
        color: #FFFFFF;
        text-decoration: none;
        font-weight: 700;
        font-size: 14px;
        transition: transform 0.15s ease, background-color 0.15s ease;
      }
      .btn:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
      }
      .links {
        margin-top: 24px;
        display: flex;
        justify-content: center;
        gap: 16px;
        font-size: 13px;
      }
      .links a {
        color: var(--muted);
        text-decoration: none;
        font-weight: 600;
      }
      .links a:hover {
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>The calculator page or URL you requested doesn't exist or has moved. Explore our suite of free grade, GPA, and test scoring tools below.</p>
      <a href="/" class="btn">Go to Easy Grade Tool</a>
      <div class="links">
        <a href="/grade-calculator">Grade Calculator</a>
        <a href="/gpa-calculator">GPA Calculator</a>
        <a href="/percentage-calculator">Percentage</a>
      </div>
    </div>
  </body>
</html>
