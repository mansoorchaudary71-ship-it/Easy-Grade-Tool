<title id="t">The chart for a 20-question test</title>
<desc id="d">Worked example for the how to grade tests faster: 0–2 wrong 100–90% — A, 3–4 wrong 85–80% — B, 5–6 wrong 75–70% — C, 7–8 wrong 65–60% — D, 9 or more wrong 55% and below — F.</desc>
