<rect x="30" y="308" width="740" height="40" rx="8" fill="#ccfbf1" stroke="#cbd5e1"/>
<text x="46" y="332" font-size="18" fill="#475569" font-weight="500" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" >9 or more wrong</text><text x="754" y="332" font-size="18" fill="#0f172a" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" >55% and below — F</text><text x="40" y="410" font-size="14" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" >Thirty tests become thirty lookups. Most teachers finish the stack in about 15 minutes once</text><text x="40" y="428" font-size="14" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" >the chart exists.</text>
