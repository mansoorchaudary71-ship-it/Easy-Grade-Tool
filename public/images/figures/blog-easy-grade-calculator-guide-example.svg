<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t d">
<title id="t">The numbers from this guide in one place</title>
<desc id="d">Worked example for the easy grade calculator online: 18 out of 20 90% — A, 17 out of 20 85% — B, 17.5 out of 20 (half points) 87.5% — B, 14 out of 18 77.8% — C, 42 out of 50 84% — B.</desc>
<rect width="800" height="450" rx="18" fill="#f8fafc"/>
<path d="M0 18a18 18 0 0 1 18-18h764a18 18 0 0 1 18 18v92H0z" fill="#0f766e"/>
<text x="40" y="52" font-size="28" fill="#ffffff" font-weight="700" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" >The numbers from this guide in one place</text>
<text x="40" y="98" font-size="15" fill="#99f6e4" font-weight="600" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" letter-spacing="1">Easy Grade Calculator Online</text>
<rect x="30" y="124" width="740" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="46" y="148" font-size="18" fill="#475569" font-weight="500" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" >18 out of 20</text><text x="754" y="148" font-size="18" fill="#0f172a" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" >90% — A</text>
<rect x="30" y="170" width="740" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="46" y="194" font-size="18" fill="#475569" font-weight="500" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" >17 out of 20</text><text x="754" y="194" font-size="18" fill="#0f172a" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" >85% — B</text>
<rect x="30" y="216" width="740" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="46" y="240" font-size="18" fill="#475569" font-weight="500" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" >17.5 out of 20 (half points)</text><text x="754" y="240" font-size="18" fill="#0f172a" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" >87.5% — B</text>
<rect x="30" y="262" width="740" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="46" y="286" font-size="18" fill="#475569" font-weight="500" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" >14 out of 18</text><text x="754" y="286" font-size="18" fill="#0f172a" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" >77.8% — C</text>
<rect x="30" y="308" width="740" height="40" rx="8" fill="#ccfbf1" stroke="#cbd5e1"/>
<text x="46" y="332" font-size="18" fill="#475569" font-weight="500" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" >42 out of 50</text><text x="754" y="332" font-size="18" fill="#0f172a" font-weight="700" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" >84% — B</text><text x="40" y="410" font-size="14" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" >Every result comes from the same two steps: divide points earned by points possible, then</text><text x="40" y="428" font-size="14" fill="#475569" font-weight="400" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" >read the letter from the scale.</text>
<text x="770" y="436" font-size="13" fill="#94a3b8" font-weight="600" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" >easygradetool.com</text>
</svg>
